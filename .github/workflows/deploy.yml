# .github/workflows/deploy.yml
# Builds the Boxtop Next.js app (standalone output), uploads it to /home/harithroo/boxtop
# on PeekHosting over FTPS, restarts Passenger, migrates the DB, then smoke-tests the site.
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, DEPLOY_URL, DEPLOY_TOKEN, DEPLOY_ORIGIN_IP.
# See docs/ENVIRONMENTS.md.
name: Deploy to PeekHosting (test)

on:
  push:
    branches: [master]
  workflow_dispatch:

# Queue, never cancel: killing a run mid-upload leaves the server with half old, half new files.
concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22        # match the version picked in cPanel
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # NEXT_PUBLIC_* are compiled into the bundle here; setting them in cPanel does nothing.
          NEXT_PUBLIC_SITE_URL: https://boxtop.harithroowijayawardhana.com
          # test site: keep it out of search engines (leave this out for box-top.lk)
          NEXT_PUBLIC_NOINDEX: "1"

      - name: Assemble deploy folder
        run: |
          set -euo pipefail
          mkdir -p deploy/app deploy/tmp
          # standalone server + its trimmed node_modules
          cp -r .next/standalone/. deploy/app/
          # static assets and public files are not included in standalone
          mkdir -p deploy/app/.next
          cp -r .next/static deploy/app/.next/static
          [ -d public ] && cp -r public deploy/app/public || true
          # SQL migrations, read at runtime by /api/deploy/migrate (not traced into standalone)
          cp -r drizzle deploy/app/drizzle
          # touching this file makes Passenger restart the app
          date > deploy/tmp/restart.txt

      # A fresh checkout gives every file a new mtime, so lftp would re-upload everything,
      # and --ignore-time would miss changed files of equal size (BUILD_ID, route chunks).
      # Instead stamp each file with an mtime derived from its content: lftp keeps remote
      # mtimes in sync (MFMT), so unchanged files match and changed ones always differ.
      - name: Stamp mtimes from content
        run: |
          set -euo pipefail
          cd deploy
          find . -type f -print0 | xargs -0 md5sum | while read -r h f; do
            f="${f#\*}"   # md5sum's binary-mode marker
            touch -d "@$(( 16#${h:0:7} + 1000000000 ))" "$f"
          done

      # lftp instead of FTP-Deploy-Action: that action's FTPS data connections fail on
      # some cPanel FTP servers ("tlsv1 alert decode error") during big uploads.
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload via FTPS (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail
          # accept "host", "ftp://host", "ftps://host" or "host:21" in the secret
          HOST=$(printf '%s' "$FTP_SERVER" | sed -E 's#^[a-z]+://##; s#/.*$##; s#:[0-9]+$##')
          cat > lftp.cmds <<EOF
          set cmd:fail-exit true
          set ftp:ssl-allow true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ssl:verify-certificate no
          set ssl:check-hostname no
          set ftp:passive-mode true
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:timeout 30
          open -p 21 $HOST
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          # 3 parallel: cPanel's Pure-FTPd caps connections per user (421 Too many connections)
          mirror --reverse --parallel=3 --no-perms --exclude-glob .git* --exclude ^tmp/ ./deploy/ ./
          # restart.txt last, so Passenger restarts only once everything is in place
          mirror --reverse --no-perms ./deploy/tmp/ ./tmp/
          bye
          EOF
          # Full transcript goes to a file (-d; the password is masked); the log shows problems + a tail.
          lftp -d -f lftp.cmds > lftp.log 2>&1
          rc=$?
          echo "lftp exit code: $rc"
          echo "uploaded files: $(grep -c '^---> STOR' lftp.log || true)"
          echo "== errors =="
          grep -i -E "fatal|access failed|login failed|^<--- (4|5)[0-9][0-9]|error|denied|too many" lftp.log | grep -v -i "certificate verification" | tail -n 50 || true
          echo "== last 40 lines =="
          tail -n 40 lftp.log
          exit $rc

      # Works out how to reach the app for the steps below.
      # DEPLOY_URL = site root, e.g. https://boxtop.harithroowijayawardhana.com
      - name: Resolve deploy target
        id: target
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_ORIGIN_IP: ${{ secrets.DEPLOY_ORIGIN_IP }}
        if: ${{ env.DEPLOY_URL != '' }}
        run: |
          set -euo pipefail
          URL=$(printf '%s' "$DEPLOY_URL" | sed -E 's#/+$##')
          case "$URL" in https://*) ;; *) echo "DEPLOY_URL must start with https:// (a redirect would turn POST into GET)"; exit 1;; esac
          HOST=$(printf '%s' "$URL" | awk -F/ '{print $3}')
          # Cloudflare serves a managed challenge to runner IPs, which no token can answer.
          # With DEPLOY_ORIGIN_IP, connect straight to the origin; SNI and Host stay correct.
          if [ -n "${DEPLOY_ORIGIN_IP:-}" ]; then
            echo "resolve=--resolve $HOST:443:$DEPLOY_ORIGIN_IP" >> "$GITHUB_OUTPUT"
            echo "Bypassing Cloudflare via origin"
          else
            echo "resolve=" >> "$GITHUB_OUTPUT"
            echo "::warning::DEPLOY_ORIGIN_IP is not set: calls go through Cloudflare, which challenges runner IPs (403 'Just a moment...')."
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # No SSH on this host: ask the freshly uploaded app to migrate its own database.
      # The route 404s unless X-Deploy-Token matches DEPLOY_TOKEN in cPanel.
      - name: Run database migrations
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          URL: ${{ steps.target.outputs.url }}
          RESOLVE: ${{ steps.target.outputs.resolve }}
        if: ${{ steps.target.outputs.url != '' && env.DEPLOY_TOKEN != '' }}
        run: |
          set -uo pipefail
          # Passenger starts the app lazily on the first request after restart.txt; retry while it boots.
          for i in 1 2 3 4 5 6; do
            # The body is not read, but the host's LiteSpeed firewall 403s a POST with no body/Content-Type.
            # No --location on purpose: a redirect must fail loudly, not silently become a GET.
            code=$(curl -s -o resp.txt -w '%{http_code}' --max-time 300 $RESOLVE \
                   -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" \
                   -H "Content-Type: application/json" -d '{}' \
                   "$URL/api/deploy/migrate")
            echo "attempt $i: HTTP $code"
            if grep -q "Just a moment" resp.txt 2>/dev/null; then echo "Blocked by Cloudflare: set the DEPLOY_ORIGIN_IP secret."; exit 1; fi
            case "$code" in
              200) cat resp.txt; echo; exit 0 ;;
              404) echo "404: DEPLOY_TOKEN differs from the cPanel env var (restart the app after changing it), or the route isn't deployed."; exit 1 ;;
              403) echo "403 from the origin server firewall:"; sed 's/<[^>]*>/ /g' resp.txt | tr -s ' \n' | head -c 400; echo; exit 1 ;;
              500) echo "Migration failed:"; cat resp.txt; echo; exit 1 ;;
            esac
            head -c 400 resp.txt 2>/dev/null; echo
            sleep 10
          done
          echo "App did not come up after 6 attempts."; exit 1

      - name: Smoke test
        env:
          URL: ${{ steps.target.outputs.url }}
          RESOLVE: ${{ steps.target.outputs.resolve }}
        if: ${{ steps.target.outputs.url != '' }}
        run: |
          set -uo pipefail
          for i in 1 2 3 4 5; do
            code=$(curl -s -o home.html -w '%{http_code}' --max-time 60 $RESOLVE "$URL/")
            echo "attempt $i: home page HTTP $code"
            if [ "$code" = 200 ] && ! grep -q "Just a moment" home.html; then
              # The page must come from the build we just uploaded (Next embeds the build id).
              BUILD_ID=$(cat .next/BUILD_ID)
              if grep -q "$BUILD_ID" home.html; then echo "OK, build $BUILD_ID is live"; exit 0; fi
              echo "200 but not build $BUILD_ID yet (old process still serving?)"
            fi
            sleep 10
          done
          exit 1
