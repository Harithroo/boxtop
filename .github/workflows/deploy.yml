# .github/workflows/deploy.yml
# Builds the Boxtop Next.js app (standalone output), uploads it over FTPS to a new release folder under
# /home/harithroo/boxtop/releases on PeekHosting, then points app/DEPLOYED_SHA at it; the server then
# migrates + restarts itself onto it via cron (src/lib/self-update.ts, scripts/deploy-launcher.cjs).
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (+ DEPLOY_URL, DEPLOY_ORIGIN_IP for the final check).
# See docs/ENVIRONMENTS.md.
name: Deploy to PeekHosting (test)

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      full_upload:
        description: "Also re-upload node_modules (normally only when its contents change)"
        type: boolean
        default: false

# Queue, never cancel: killing a run mid-upload leaves the server with half old, half new files.
concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22        # match the version picked in cPanel
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # NEXT_PUBLIC_* are compiled into the bundle here; setting them in cPanel does nothing.
          NEXT_PUBLIC_SITE_URL: https://boxtop.harithroowijayawardhana.com
          # test site: keep it out of search engines (leave this out for box-top.lk)
          NEXT_PUBLIC_NOINDEX: "1"
          # reported by /api/health; the smoke test checks it to prove the new build is running
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}

      # Each deploy goes to a NEW folder on the server, releases/nm-<deps hash>/<sha>/, and the running
      # build is never touched. Uploading over the live app/ is what took the site down during deploys:
      # for the minutes the upload took, the running server loaded a mix of old and new chunks. Layout
      # and start-up: scripts/deploy-launcher.cjs (uploaded as app/server.js, the cPanel startup file).
      - name: Assemble deploy folder
        run: |
          set -euo pipefail
          mkdir -p deploy/release deploy/nm deploy/launcher deploy/marker
          # standalone server + its trimmed node_modules
          cp -r .next/standalone/. deploy/release/
          # Turbopack reaches serverExternalPackages (sharp, mysql2) through symlinks,
          # .next/node_modules/<pkg>-<hash> -> ../../node_modules/<pkg>. On the server node_modules sits
          # one level above the release, and FTP can't be relied on to create symlinks, so replace each
          # with a copy of the package (its own dependencies still resolve from the shared node_modules).
          for link in deploy/release/.next/node_modules/*; do
            [ -L "$link" ] || continue
            target=$(readlink -f "$link"); rm "$link"; cp -rL "$target" "$link"
          done
          [ -z "$(find deploy/release -type l)" ] || { echo "::error::symlinks left in the release"; find deploy/release -type l; exit 1; }
          # Copy CONTENTS ("dir/."), never "cp -r dir dest": standalone already ships a partial
          # public/ (only traced files), and "cp -r public deploy/release/public" then nested the full
          # copy at public/public/, which nothing serves (that was the 19 missing images).
          mkdir -p deploy/release/.next/static deploy/release/public
          cp -r .next/static/. deploy/release/.next/static/
          cp -r public/. deploy/release/public/
          # Guard: every file in public/ must be at the same path in the deploy, and no nesting.
          [ ! -e deploy/release/public/public ] && [ ! -e deploy/release/.next/static/static ] || { echo "::error::nested copy"; exit 1; }
          missing=$(cd public && find . -type f | while read -r f; do [ -f "../deploy/release/public/$f" ] || echo "$f"; done)
          [ -z "$missing" ] || { echo "::error::not in deploy: $missing"; exit 1; }
          # SQL migrations, applied on the server by src/lib/self-update.ts (not traced into standalone)
          cp -r drizzle deploy/release/drizzle
          # node_modules goes up one level, shared by every release with the same dependencies
          mv deploy/release/node_modules deploy/nm/node_modules
          cp scripts/deploy-launcher.cjs deploy/launcher/server.js
          # Uploaded LAST, in its own step: tells the running app that the new release is complete.
          echo "$GITHUB_SHA" > deploy/marker/DEPLOYED_SHA
          echo "$GITHUB_SHA" > deploy/RELEASE_COMPLETE
          echo "$GITHUB_SHA" > deploy/NM_COMPLETE

      # Fresh mtimes so lftp uploads every file (never content-derived mtimes or --ignore-time: lftp
      # then skipped changed files). node_modules lives in a folder named after its content hash, so
      # the same dependencies are uploaded once and new ones never land on top of old ones.
      - name: Fresh mtimes, node_modules hash
        id: nm
        run: |
          set -euo pipefail
          find deploy -exec touch {} +
          hash=$(cd deploy/nm && find node_modules -type f -print0 | LC_ALL=C sort -z | xargs -0 md5sum | md5sum | cut -c1-16)
          echo "dir=releases/nm-$hash" >> "$GITHUB_OUTPUT"
          echo "node_modules: releases/nm-$hash"

      # lftp instead of FTP-Deploy-Action: that action's FTPS data connections fail on
      # some cPanel FTP servers ("tlsv1 alert decode error") during big uploads.
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Shared lftp runner: writes the connection header, appends the given commands, runs it and
      # prints errors + a tail. Only commands proven on this host are used (see docs/ENVIRONMENTS.md).
      - name: Prepare lftp runner
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          # accept "host", "ftp://host", "ftps://host" or "host:21" in the secret
          HOST=$(printf '%s' "$FTP_SERVER" | sed -E 's#^[a-z]+://##; s#/.*$##; s#:[0-9]+$##')
          cat > ftp-run.sh <<'SH'
          #!/usr/bin/env bash
          # usage: ftp-run.sh <name> <lftp commands...>   (FTP_HOST/FTP_USERNAME/FTP_PASSWORD from env)
          set +e -u
          name=$1; shift
          trap 'rm -f "$name.cmds"' EXIT   # the command file holds the password
          {
            echo 'set cmd:fail-exit true'
            echo 'set ftp:ssl-allow true'
            echo 'set ftp:ssl-force true'
            echo 'set ftp:ssl-protect-data true'
            echo 'set ftp:ssl-protect-list true'
            echo 'set ssl:verify-certificate no'
            echo 'set ssl:check-hostname no'
            echo 'set ftp:passive-mode true'
            echo 'set net:max-retries 5'
            echo 'set net:reconnect-interval-base 5'
            echo 'set net:timeout 30'
            echo "open -p 21 $FTP_HOST"
            echo "user \"$FTP_USERNAME\" \"$FTP_PASSWORD\""
            printf '%s\n' "$@"
            echo 'bye'
          } > "$name.cmds"
          # -d: full FTP transcript (password masked) into a file; show only problems + a tail
          lftp -d -f "$name.cmds" > "$name.log" 2>&1
          rc=$?
          echo "[$name] lftp exit code: $rc, files uploaded: $(grep -c '^---> STOR' "$name.log")"
          echo "[$name] == errors =="
          grep -i -E "fatal|access failed|login failed|^<--- (4|5)[0-9][0-9]|error|denied|too many" "$name.log" | grep -v -i "certificate verification" | tail -n 50
          echo "[$name] == last 30 lines =="
          tail -n 30 "$name.log"
          exit $rc
          SH
          chmod +x ftp-run.sh
          echo "FTP_HOST=$HOST" >> "$GITHUB_ENV"


      # NM_COMPLETE / RELEASE_COMPLETE are uploaded after their folder, so their presence means the
      # folder is whole. A missing one (or an FTP error) means: upload it.
      - name: What's already on the server
        id: remote
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          NM_DIR: ${{ steps.nm.outputs.dir }}
          FULL_UPLOAD: ${{ inputs.full_upload }}
        run: |
          if [ "$FULL_UPLOAD" != "true" ] && ./ftp-run.sh check-nm "cls -1 $NM_DIR/NM_COMPLETE" > /dev/null; then
            echo "node_modules: already on the server"; echo "nm=present" >> "$GITHUB_OUTPUT"
          fi
          # Same commit already uploaded completely (a re-run): don't rewrite it, it may be the one running.
          if ./ftp-run.sh check-release "cls -1 $NM_DIR/$GITHUB_SHA/RELEASE_COMPLETE" > /dev/null; then
            echo "release: already on the server"; echo "release=present" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload node_modules via FTPS (only when the dependencies changed)
        if: steps.remote.outputs.nm != 'present'
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          NM_DIR: ${{ steps.nm.outputs.dir }}
        run: |
          # 3 parallel: cPanel's Pure-FTPd caps connections per user (421 Too many connections).
          ./ftp-run.sh node_modules \
            "mirror --reverse --parallel=3 --no-perms ./deploy/nm/node_modules/ ./$NM_DIR/node_modules/" \
            "put -O $NM_DIR ./deploy/NM_COMPLETE"

      - name: Upload release via FTPS
        if: steps.remote.outputs.release != 'present'
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          NM_DIR: ${{ steps.nm.outputs.dir }}
        run: |
          # A new folder no running process uses (~950 files, ~13 MB).
          ./ftp-run.sh upload \
            "mirror --reverse --parallel=3 --no-perms ./deploy/release/ ./$NM_DIR/$GITHUB_SHA/" \
            "put -O $NM_DIR/$GITHUB_SHA ./deploy/RELEASE_COMPLETE"

      # Only after the release is whole: the launcher (a few KB, only read when a process starts), then
      # the marker. Within a minute the server's cron (/api/cron) sees DEPLOYED_SHA differ from the
      # running build, applies the new release's migrations and exits; LiteSpeed then runs the launcher
      # on the next request, which starts the new release. See src/lib/self-update.ts.
      # (No --delete: mirroring into app/ leaves everything else alone.)
      - name: Publish launcher and deploy marker
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          ./ftp-run.sh marker \
            'mirror --reverse --no-perms ./deploy/launcher/ ./app/' \
            'mirror --reverse --no-perms ./deploy/marker/ ./app/'

      # Best-effort check from outside. GitHub's runner IPs are often bot-challenged (Cloudflare and
      # the host's own firewall), so an unreadable answer is a warning, not a failure. A readable
      # answer showing the wrong build after 5 minutes IS a failure.
      - name: Verify the new build is live
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_ORIGIN_IP: ${{ secrets.DEPLOY_ORIGIN_IP }}
        run: |
          set +e -u   # GitHub starts bash with -e; we check results ourselves
          if [ -z "${DEPLOY_URL:-}" ]; then echo "::warning::DEPLOY_URL not set; skipping verification."; exit 0; fi
          URL=$(printf '%s' "$DEPLOY_URL" | sed -E 's#/+$##')
          HOST=$(printf '%s' "$URL" | awk -F/ '{print $3}')
          RESOLVE=(); [ -n "${DEPLOY_ORIGIN_IP:-}" ] && RESOLVE=(--resolve "$HOST:443:$DEPLOY_ORIGIN_IP")
          seen=""
          for i in $(seq 1 15); do   # 15 x 20s = 5 min: cron runs every minute, then a restart
            sleep 20
            body=$(curl -s --max-time 20 "${RESOLVE[@]}" "$URL/api/health")
            live=$(printf '%s' "$body" | sed -nE 's/^\{"build":"([^"]*)"\}$/\1/p')
            if [ -z "$live" ]; then echo "check $i: no readable answer (bot challenge or app starting)"; continue; fi
            seen=$live; echo "check $i: running $live"
            if [ "$live" = "$GITHUB_SHA" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "${RESOLVE[@]}" "$URL/")
              echo "home page: HTTP $code"
              [ "$code" = 200 ] && { echo "OK: $GITHUB_SHA is live"; exit 0; }
              echo "::error::New build is running but the home page returned $code."; exit 1
            fi
          done
          if [ -n "$seen" ]; then
            echo "::error::Still running $seen after 5 minutes, expected $GITHUB_SHA. Check the cron job (cPanel → Cron Jobs) and open /api/cron?key=CRON_SECRET to see the deploy status."
            exit 1
          fi
          echo "::warning::Could not read /api/health from GitHub (bot protection). Check $URL/api/health yourself; it should show $GITHUB_SHA within ~2 minutes."
