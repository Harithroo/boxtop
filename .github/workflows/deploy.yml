# .github/workflows/deploy.yml
# Builds the Boxtop Next.js app (standalone output) and uploads it to
# /home/harithroo/boxtop on PeekHosting via FTP, then restarts Passenger.
name: Deploy to PeekHosting (test)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22        # match the version picked in cPanel
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Build-time public vars go here (add as repo secrets), e.g.:
          NEXT_PUBLIC_SITE_URL: https://boxtop.harithroowijayawardhana.com

      - name: Assemble deploy folder
        run: |
          mkdir -p deploy/app deploy/tmp
          # standalone server + its trimmed node_modules
          cp -r .next/standalone/. deploy/app/
          # static assets and public files are not included in standalone
          mkdir -p deploy/app/.next
          cp -r .next/static deploy/app/.next/static
          [ -d public ] && cp -r public deploy/app/public || true
          # touching this file makes Passenger restart the app
          date > deploy/tmp/restart.txt

      # lftp instead of FTP-Deploy-Action: that action's FTPS data connections fail on
      # some cPanel FTP servers ("tlsv1 alert decode error") during big uploads.
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload via FTPS (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # accept "host", "ftp://host", "ftps://host" or "host:21" in the secret
          HOST=$(printf '%s' "$FTP_SERVER" | sed -E 's#^[a-z]+://##; s#/.*$##; s#:[0-9]+$##')
          cat > lftp.cmds <<EOF
          set cmd:fail-exit true
          set ftp:ssl-allow true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ssl:verify-certificate no
          set ssl:check-hostname no
          set ftp:passive-mode true
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:timeout 30
          open -p 21 $HOST
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          pwd
          ls
          mirror --reverse --parallel=6 --no-perms --exclude-glob .git* --exclude ^tmp/ ./deploy/ ./
          mirror --reverse --no-perms ./deploy/tmp/ ./tmp/
          bye
          EOF
          # -d prints the FTP conversation (the password is masked) so a failure shows its reason
          lftp -d -f lftp.cmds 2>&1 | grep -v -i "^<--- 150\|^<--- 226\|^---> STOR\|^---> TYPE\|^---> PASV\|^<--- 227" | tail -n 200
          test "${PIPESTATUS[0]}" -eq 0
